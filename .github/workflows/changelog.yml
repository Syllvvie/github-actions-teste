name: Changelog

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar CHANGELOG.md
        run: |
          {
            echo "# Changelog"
            echo
            echo "Gerado automaticamente em $(date +'%d/%m/%Y %H:%M')"
            echo
            git log --pretty=format:"- %ad | %s (%an) [%h]" --date=short
          } > CHANGELOG.md
          cat CHANGELOG.md
